name: arogyamitra_citizen
description: >-
  ArogyaMitra citizen application. Multilingual, low-literacy friendly care
  navigation for Android and the web (PRD 5.1).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  am_auth: ^0.1.0
  am_core: ^0.1.0
  am_localization: ^0.1.0
  am_maps: ^0.1.0
  am_models: ^0.1.0
  am_networking: ^0.1.0
  am_ui: ^0.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  meta: ^1.16.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
